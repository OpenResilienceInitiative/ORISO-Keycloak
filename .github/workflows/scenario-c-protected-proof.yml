name: Scenario C protected invitation counterfactual

on:
  pull_request:
    branches: [dev]
    paths:
      - keycloak-image/**
      - .github/workflows/scenario-c-protected-proof.yml
  push:
    branches: [dev, codex/367-c-protected-receiver-20261021, codex/367-c-receiver-finish-20261021, codex/367-c-maintenance-keycloak-20261021]
    paths:
      - keycloak-image/**
      - .github/workflows/scenario-c-protected-proof.yml

permissions:
  contents: read

concurrency:
  group: protected-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-human-approval-counterfactual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: keycloak-image/account-lifecycle-spi/pom.xml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Install verified Maven 3.9.14
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://archive.apache.org/dist/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz \
            --output "$RUNNER_TEMP/maven.tar.gz"
          printf '%s  %s\n' \
            d50af8ab5e6005b46a07f0ce9d3719e67cfdf898da988a84871304cd59fb1af0fef2f99dea709e6e66f21f732f905979b5c2dce6b6860406f60a70e84d9cf0b8 \
            "$RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"
      - name: Package provider and run all current composed unit checks
        working-directory: keycloak-image/account-lifecycle-spi
        env:
          MAVEN_OPTS: -Xmx512m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2
        run: mvn -B -q clean package '-DargLine=-Xmx256m -XX:MaxMetaspaceSize=128m -XX:ActiveProcessorCount=2'
      - name: Run protected approval and account creation cases
        env:
          PROTECTED_PROOF_RESOURCE_PROFILE: github-ubuntu-24-amd64-v1
        shell: bash
        run: |
          set -euo pipefail
          docker info > /dev/null
          export LIFECYCLE_C_TEST_JAR="$GITHUB_WORKSPACE/keycloak-image/account-lifecycle-spi/target/account-lifecycle-spi-1.0-SNAPSHOT.jar"
          python keycloak-image/account-lifecycle-spi/tests/run_protected.py \
            --report keycloak-image/account-lifecycle-spi/proof-output/protected.json
      - name: Clean up only this fresh job's labelled native resources
        if: always()
        shell: bash
        run: |
          python - <<'PYCODE'
          import re
          import subprocess
          # Fresh hosted daemon; exact fixture labels and prefixes both required.
          rows = subprocess.run(
              ["docker", "ps", "-a", "--format", "{{.ID}} {{.Names}}", "--filter",
               "label=oriso-protected-receiver-test=true"],
              capture_output=True, text=True, check=True, timeout=30).stdout.splitlines()
          for row in rows:
              identifier, name = row.split()
              if not re.fullmatch(r"oriso-c-lifecycle-[a-f0-9]{10}", name):
                  raise SystemExit("Unexpected labelled container; refusing cleanup")
              subprocess.run(["docker", "rm", "-fv", identifier],
                             check=True, capture_output=True, timeout=30)
          volumes = subprocess.run(
              ["docker", "volume", "ls", "--format", "{{.Name}}", "--filter",
               "label=oriso-protected-receiver-test=true"],
              capture_output=True, text=True, check=True, timeout=30).stdout.splitlines()
          for volume in volumes:
              if not re.fullmatch(r"oriso-protected-h2-[a-f0-9]{32}", volume):
                  raise SystemExit("Unexpected labelled volume; refusing cleanup")
              subprocess.run(["docker", "volume", "rm", volume],
                             check=True, capture_output=True, timeout=30)
          PYCODE
      - name: Upload sanitized proof and complete unit XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protected-human-approval-counterfactual
          path: |
            keycloak-image/account-lifecycle-spi/proof-output/*.json
            keycloak-image/account-lifecycle-spi/proof-output/*.xml
            keycloak-image/account-lifecycle-spi/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

  native-installation-inventory:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case:
          - independent-cleanup-status
          - direct-authentication-before-realm-lock
          - committed-peer-policy-withdrawal
          - committed-peer-policy-revision
          - committed-own-tenant-peer-cancel
          - committed-own-tenant-peer
          - binding-rollback-only-unavailable
          - binding-corrected-restart-available
          - binding-commit-failure-unavailable
          - binding-commit-ordering-available
          - extra-denies-prepared-five
          - missing-required-client
          - missing-required-service-account
          - unregistered-technical-human
          - unregistered-task-role-human
          - unregistered-inherited-task-human
          - allowlisted-denied-human
          - binding-drift-login-available
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+8.0.LTS'
          cache: maven
          cache-dependency-path: keycloak-image/account-lifecycle-spi/pom.xml
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
      - name: Install verified Maven 3.9.14
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://archive.apache.org/dist/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz \
            --output "$RUNNER_TEMP/maven.tar.gz"
          printf '%s  %s\n' \
            d50af8ab5e6005b46a07f0ce9d3719e67cfdf898da988a84871304cd59fb1af0fef2f99dea709e6e66f21f732f905979b5c2dce6b6860406f60a70e84d9cf0b8 \
            "$RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"
      - name: Package provider and run all current composed unit checks
        working-directory: keycloak-image/account-lifecycle-spi
        env:
          MAVEN_OPTS: -Xmx512m -XX:MaxMetaspaceSize=256m -XX:ActiveProcessorCount=2
        run: mvn -B -q clean package '-DargLine=-Xmx256m -XX:MaxMetaspaceSize=128m -XX:ActiveProcessorCount=2'
      - name: Check actual native installation inventory
        env:
          PROTECTED_PROOF_RESOURCE_PROFILE: github-ubuntu-24-amd64-v1
          PROTECTED_INSTALLATION_CASE: ${{ matrix.case }}
        shell: bash
        run: |
          set -euo pipefail
          docker info > /dev/null
          export LIFECYCLE_C_TEST_JAR="$GITHUB_WORKSPACE/keycloak-image/account-lifecycle-spi/target/account-lifecycle-spi-1.0-SNAPSHOT.jar"
          if [ "$PROTECTED_INSTALLATION_CASE" = independent-cleanup-status ]; then
            export LIFECYCLE_AUTH_LOCK_COMPANION_JAR="$RUNNER_TEMP/oriso-proof-auth-lock-companion.jar"
            python keycloak-image/account-lifecycle-spi/tests/build_auth_lock_companion.py \
              --jar "$LIFECYCLE_AUTH_LOCK_COMPANION_JAR"
            python -m unittest discover -s keycloak-image/account-lifecycle-spi/tests \
              -p test_protected_cleanup_status_controls.py -q
            python keycloak-image/account-lifecycle-spi/tests/run_protected_cleanup_status.py \
              --report keycloak-image/account-lifecycle-spi/proof-output/cleanup-status.json
          elif [ "$PROTECTED_INSTALLATION_CASE" = direct-authentication-before-realm-lock ]; then
            export LIFECYCLE_AUTH_LOCK_COMPANION_JAR="$RUNNER_TEMP/oriso-proof-auth-lock-companion.jar"
            python -m unittest discover -s keycloak-image/account-lifecycle-spi/tests \
              -p 'test_protected_auth_lock*controls.py' -q
            python keycloak-image/account-lifecycle-spi/tests/build_auth_lock_companion.py \
              --jar "$LIFECYCLE_AUTH_LOCK_COMPANION_JAR"
            python keycloak-image/account-lifecycle-spi/tests/run_protected_auth_lock_direct.py \
              --report keycloak-image/account-lifecycle-spi/proof-output/auth-lock-direct.json
          elif [ "$PROTECTED_INSTALLATION_CASE" = binding-rollback-only-unavailable ] ||
             [ "$PROTECTED_INSTALLATION_CASE" = binding-commit-failure-unavailable ] ||
             [ "$PROTECTED_INSTALLATION_CASE" = binding-commit-ordering-available ]; then
            export LIFECYCLE_PROOF_COMPANION_JAR="$RUNNER_TEMP/oriso-proof-readiness-companion.jar"
            python keycloak-image/account-lifecycle-spi/tests/build_readiness_companion.py \
              --jar "$LIFECYCLE_PROOF_COMPANION_JAR"
            case "$PROTECTED_INSTALLATION_CASE" in
              binding-rollback-only-unavailable)
                python keycloak-image/account-lifecycle-spi/tests/run_protected_rollback.py \
                  --report keycloak-image/account-lifecycle-spi/proof-output/rollback.json ;;
              binding-commit-failure-unavailable)
                python keycloak-image/account-lifecycle-spi/tests/run_protected_commit_failure.py \
                  --report keycloak-image/account-lifecycle-spi/proof-output/commit-failure-readiness.json ;;
              binding-commit-ordering-available)
                python keycloak-image/account-lifecycle-spi/tests/run_protected_commit_ordering.py \
                  --report keycloak-image/account-lifecycle-spi/proof-output/commit-ordering-readiness.json ;;
            esac
          elif [ "$PROTECTED_INSTALLATION_CASE" = committed-peer-policy-withdrawal ] ||
               [ "$PROTECTED_INSTALLATION_CASE" = committed-peer-policy-revision ]; then
            python -m unittest discover -s keycloak-image/account-lifecycle-spi/tests \
              -p test_protected_peer_policy_controls.py -q
            python keycloak-image/account-lifecycle-spi/tests/run_protected_peer_policy.py \
              --report keycloak-image/account-lifecycle-spi/proof-output/peer-policy-restart.json
          elif [ "$PROTECTED_INSTALLATION_CASE" = committed-own-tenant-peer-cancel ]; then
            python -m unittest discover -s keycloak-image/account-lifecycle-spi/tests \
              -p test_protected_peer_cancel_controls.py -q
            python keycloak-image/account-lifecycle-spi/tests/run_protected_peer_cancel.py \
              --report keycloak-image/account-lifecycle-spi/proof-output/peer-cancel.json
          elif [ "$PROTECTED_INSTALLATION_CASE" = committed-own-tenant-peer ]; then
            python -m unittest discover -s keycloak-image/account-lifecycle-spi/tests \
              -p test_protected_peer_controls.py -q
            python keycloak-image/account-lifecycle-spi/tests/run_protected_peer.py \
              --report keycloak-image/account-lifecycle-spi/proof-output/peer.json
          elif [ "$PROTECTED_INSTALLATION_CASE" = binding-corrected-restart-available ]; then
            python keycloak-image/account-lifecycle-spi/tests/run_protected_corrected_readiness.py \
              --report keycloak-image/account-lifecycle-spi/proof-output/corrected-readiness.json
          elif [ "$PROTECTED_INSTALLATION_CASE" = binding-drift-login-available ]; then
            python keycloak-image/account-lifecycle-spi/tests/run_protected_readiness.py \
              --report keycloak-image/account-lifecycle-spi/proof-output/readiness.json
          else
            python keycloak-image/account-lifecycle-spi/tests/run_protected_installation.py \
              --case "$PROTECTED_INSTALLATION_CASE" \
              --report keycloak-image/account-lifecycle-spi/proof-output/installation.json
          fi
      - name: Clean up only this fresh job's labelled native resources
        if: always()
        shell: bash
        run: |
          python - <<'PYCODE'
          import re
          import subprocess
          # Fresh hosted daemon; exact fixture labels and prefixes both required.
          rows = subprocess.run(
              ["docker", "ps", "-a", "--format", "{{.ID}} {{.Names}}", "--filter",
               "label=oriso-protected-receiver-test=true"],
              capture_output=True, text=True, check=True, timeout=30).stdout.splitlines()
          for row in rows:
              identifier, name = row.split()
              if not re.fullmatch(r"oriso-c-lifecycle-[a-f0-9]{10}", name):
                  raise SystemExit("Unexpected labelled container; refusing cleanup")
              subprocess.run(["docker", "rm", "-fv", identifier],
                             check=True, capture_output=True, timeout=30)
          volumes = subprocess.run(
              ["docker", "volume", "ls", "--format", "{{.Name}}", "--filter",
               "label=oriso-protected-receiver-test=true"],
              capture_output=True, text=True, check=True, timeout=30).stdout.splitlines()
          for volume in volumes:
              if not re.fullmatch(r"oriso-protected-h2-[a-f0-9]{32}", volume):
                  raise SystemExit("Unexpected labelled volume; refusing cleanup")
              subprocess.run(["docker", "volume", "rm", volume],
                             check=True, capture_output=True, timeout=30)
          PYCODE
      - name: Upload sanitized proof and complete unit XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protected-installation-${{ matrix.case }}
          path: |
            keycloak-image/account-lifecycle-spi/proof-output/*.json
            keycloak-image/account-lifecycle-spi/proof-output/*.xml
            keycloak-image/account-lifecycle-spi/target/surefire-reports/TEST-*.xml
            ${{ runner.temp }}/oriso-proof-readiness-companion.jar
            ${{ runner.temp }}/oriso-proof-auth-lock-companion.jar
          if-no-files-found: error
          retention-days: 14
