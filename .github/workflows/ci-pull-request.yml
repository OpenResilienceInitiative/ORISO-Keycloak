name: CI - Pull Request

on:
  pull_request:

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify backend service-client export
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Compile and Package Java application
        uses: ./.github/actions/maven-build
        with:
          java_version: "21"
          working_directory: keycloak-image

      - name: Build exact provider image for permission contract
        run: docker build --tag oriso-keycloak:permission-contract keycloak-image

      - name: Verify real tokens, native HTTP denials and durable command state
        run: python3 scripts/test-task-command-permissions.py --image oriso-keycloak:permission-contract

      - name: Verify explicit temporary legacy OTP compatibility
        run: python3 scripts/test-task-command-permissions.py --image oriso-keycloak:permission-contract --legacy-otp-compatibility
