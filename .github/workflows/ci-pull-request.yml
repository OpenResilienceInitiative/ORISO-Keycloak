name: CI - Pull Request

on:
  pull_request:

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify backend service-client export
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Compile and Package Java application
        uses: ./.github/actions/maven-build
        with:
          java_version: "21"
          working_directory: keycloak-image/otp-config-spi

      - name: Create Docker image
        uses: ./.github/actions/docker-build-push
        with:
          push_to_ghcr: false
          image_name: oriso-keycloak
          context: keycloak-image
          github_token: ${{ secrets.GITHUB_TOKEN }}
