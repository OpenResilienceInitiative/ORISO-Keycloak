# Dependabot configuration.
#
# Dependabot reads this file from the repository DEFAULT branch (`main`) only,
# so it takes effect once it is released to `main`.
#
# `target-branch` applies to VERSION updates only. SECURITY updates always open
# against `main`. Entries WITHOUT `target-branch` therefore carry the security
# grouping (their version updates are switched off with limit 0); entries WITH
# `target-branch: dev` carry the version updates. Apply security fixes that
# matter onto `dev` by hand.
version: 2
updates:
    - package-ecosystem: 'maven'
      directory: '/keycloak-image/otp-config-spi'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 0 # version updates live in the dev entry below
      groups:
          maven-security-production:
              applies-to: security-updates
              dependency-type: 'production'
              patterns: ['*']
          maven-security-development:
              applies-to: security-updates
              dependency-type: 'development'
              patterns: ['*']

    - package-ecosystem: 'maven'
      directory: '/keycloak-image/otp-config-spi'
      target-branch: 'dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 3
      commit-message:
          prefix: 'chore(deps)'
      groups:
          maven-minor-and-patch:
              applies-to: version-updates
              patterns: ['*']
              update-types: ['minor', 'patch']
      ignore:
          # Majors are upgraded deliberately, never by bot.
          - dependency-name: '*'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'github-actions'
      directories:
          - '/'
          - '/.github/actions/*'
      target-branch: 'dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 1
      commit-message:
          prefix: 'chore(actions)'
      groups:
          github-actions:
              patterns: ['*']
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'docker'
      directory: '/keycloak-image'
      target-branch: 'dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 1
      commit-message:
          prefix: 'chore(docker)'
      groups:
          docker-base-images:
              patterns: ['*']
      ignore:
          # Keycloak and Java majors are upgraded deliberately.
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
