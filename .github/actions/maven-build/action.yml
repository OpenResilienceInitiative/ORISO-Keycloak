name: Reusable Maven Build steps
description: Set up Java and build the Keycloak SPI with Maven.

inputs:
  java_version:
    description: Java version to install for the Maven build.
    required: true
  working_directory:
    description: Directory containing the Maven project to build.
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up JDK and Maven
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java_version }}
        distribution: "temurin"
        cache: maven

    - name: Build with Maven
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: mvn -B package
