name: Reusable Maven Build steps

inputs:
  java_version:
    required: true
    type: string
  working_directory:
    required: false
    default: "."
    type: string

runs:
  using: "composite"
  steps:
    - name: Set up JDK and Maven
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.java_version }}
        distribution: "temurin"
        cache: maven

    - name: Install same-source provided lifecycle dependency for OTP
      if: inputs.working_directory == 'keycloak-image/otp-config-spi'
      shell: bash
      env:
        MAVEN_OPTS: -Xmx512m -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=2
      run: mvn -B -q -f keycloak-image/account-lifecycle-spi/pom.xml clean install '-DargLine=-Xmx256m -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=2'

    - name: Build with Maven
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: mvn -B package
